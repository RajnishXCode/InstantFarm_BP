
name: Build and Deploy InstantFarm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Behavior Pack
        run: npm run build

      - name: Verify Build Output
        run: |
          test -f behavior_pack/manifest.json
          test -f behavior_pack/scripts/main.js
          test -f resource_pack/manifest.json

      - name: Package Minecraft Packs
        run: |
          mkdir -p release/staging

          # Package Behavior Pack
          cd behavior_pack
          zip -qr ../release/InstantFarm_BP.mcpack .
          cd ..

          # Package Resource Pack
          cd resource_pack
          zip -qr ../release/InstantFarm_RP.mcpack .
          cd ..

          # Prepare combined add-on
          mkdir -p release/staging/InstantFarm_BP
          mkdir -p release/staging/InstantFarm_RP

          cp -R behavior_pack/. release/staging/InstantFarm_BP/
          cp -R resource_pack/. release/staging/InstantFarm_RP/

          # Create combined .mcaddon
          cd release/staging
          zip -qr ../InstantFarm_VanillaPlus.mcaddon \
            InstantFarm_BP InstantFarm_RP
          cd ../..

          # Remove temporary staging files
          rm -rf release/staging

      - name: Generate Download Page
        run: |
          export DEPLOYED_AT_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export DEPLOYED_AT=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          export BUILD_COMMIT="${GITHUB_SHA::7}"
          export BUILD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          node tools/render-site.mjs

          touch release/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./release
          force_orphan: true
